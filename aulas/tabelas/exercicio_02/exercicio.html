<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="4" id="title">Festival de cinema 2026</th>
            </tr>
            <tr id="category">
                <th>Categoria</th>
                <th>Filme</th>
                <th>Horário</th>
                <th>Sala</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2" id="genero">Ação</th>
                <th id="selection">Vingadores</th>
                <th id="selection">18:00</th>
                <th id="selection">1</th>
            </tr>
            <tr>
                <th id="selection">Batman</th>
                <th id="selection">20:30</th>
                <th id="selection">2</th>
            </tr>
            <tr>
                <th rowspan="2" id="genero">Animação</th>
                <th id="selection">Toy Story</th>
                <th id="selection">16:00</th>
                <th id="selection">3</th>
            </tr>
            <tr>
                <th id="selection">Frozen</th>
                <th id="selection">17:30</th>
                <th id="selection">4</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
